<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2A26"/>
      <stop offset="100%" stop-color="#171512"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C451"/>
      <stop offset="100%" stop-color="#E09A2E"/>
    </linearGradient>
  </defs>

  <!-- rounded square base, matches modern app-icon proportions -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- outer chevrons: pointing inward = "compress / squeeze down" -->
  <path d="M 152 176 L 96 256 L 152 336"
        fill="none" stroke="url(#glyph)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 360 176 L 416 256 L 360 336"
        fill="none" stroke="url(#glyph)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- center token/coin being compressed -->
  <circle cx="256" cy="256" r="54" fill="url(#glyph)"/>
  <path d="M 238 256 h 36 M 256 238 v 36" stroke="#171512" stroke-width="12" stroke-linecap="round"/>
</svg>
